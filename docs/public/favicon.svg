<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    favicon 专用，与 logo.svg 分开：
    logo 在导航栏有 24px+ 的显示空间，可以放环与弧线；
    favicon 常被压到 16px，细节会糊成一团，所以只留一滴实心水珠。
    深色底 + 旧金图形，在浅色与深色标签栏里都能立住。
  -->
  <rect width="32" height="32" rx="7" fill="#14171d"/>
  <path d="M16 6c0 0 6 7.2 6 11.4a6 6 0 1 1-12 0C10 13.2 16 6 16 6Z" fill="#c9a227"/>
  <path d="M13.2 18.6a3.6 3.6 0 0 0 3 3.4" stroke="#14171d" stroke-width="1.4"
        stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
